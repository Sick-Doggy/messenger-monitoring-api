parameters:
    ingest_api_key: '%env(INGEST_API_KEY)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $ingestApiKey: '%ingest_api_key%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Document/'
