security:
    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            stateless: true
            custom_authenticators:
                - App\Security\ApiKeyAuthenticator
            entry_point: App\Security\ApiKeyAuthenticator

    # Note: Only the *first* matching rule is applied
    access_control:
        # dokumentacja i entrypoint API — bez klucza (spec OpenAPI ma być dostępna):
        # /api (Swagger UI), /api.json{ld}, /api/docs.{format}
        - { path: ^/api(\.\w+|/docs(\.\w+)?)?$, roles: PUBLIC_ACCESS }
        # reszta API wymaga nagłówka X-Api-Key
        - { path: ^/api, roles: ROLE_API }
