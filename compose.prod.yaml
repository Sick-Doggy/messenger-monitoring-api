# Produkcyjne uruchomienie pobrane z rejestru:
#   docker compose -f compose.prod.yaml up -d
# Obraz php pochodzi z Docker Hub (publikowany workflowem na git tag).
# Wymagany plik docker/nginx/default.conf w katalogu obok.

name: messenger-monitoring-api

services:

  php:
    image: sickdoggy/messenger-monitoring-api:latest
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET:?Wymagane — ustaw w .env lub env}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017}
      MONGODB_DB: ${MONGODB_DB:-messenger_monitoring}
    depends_on:
      - mongodb
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    restart: unless-stopped

  mongodb:
    image: mongo:8
    volumes:
      - mongodb_data:/data/db:rw
    command: ['--quiet']
    restart: unless-stopped

volumes:
  mongodb_data:
