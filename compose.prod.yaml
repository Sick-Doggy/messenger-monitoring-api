# Produkcyjne uruchomienie pobrane z rejestru:
#   docker compose -f compose.prod.yaml up -d
# Obraz pochodzi z Docker Hub (publikowany workflowem na git tag).
# Image jest samowystarczalny: FrankenPHP (Caddy + PHP) serwuje HTTP na 8080,
# bez zewnętrznego nginx/fpm.

name: messenger-monitoring-api

services:

  php:
    image: sickdoggy/messenger-monitoring-api:latest
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:?Required — set in .env or environment}
      API_KEY: ${API_KEY:?Required — key sent as the X-Api-Key header}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017}
      MONGODB_DB: ${MONGODB_DB:-messenger_monitoring}
    depends_on:
      - mongodb
    restart: unless-stopped

  mongodb:
    image: mongo:8
    volumes:
      - mongodb_data:/data/db:rw
    command: ['--quiet']
    restart: unless-stopped

volumes:
  mongodb_data:
