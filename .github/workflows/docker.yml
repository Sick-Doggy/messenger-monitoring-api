name: docker

on:
  push:
    tags:
      - 'v*'

env:
  IMAGE: sickdoggy/messenger-monitoring-api

jobs:
  test:
    name: Testy w obrazie dev
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - name: Build obrazu dev
        run: docker build -f docker/php/Dockerfile --target dev -t messenger-monitoring-api:test .

      - name: Composer install + PHPUnit
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
        run: |
          docker run --rm --network host \
            -v "$PWD:/var/www" \
            -e MONGODB_URI \
            -e MONGODB_DB=messenger_monitoring_test \
            -e COMPOSER_ALLOW_SUPERUSER=1 \
            messenger-monitoring-api:test \
            sh -c 'composer install --no-interaction --prefer-dist && vendor/bin/phpunit -c phpunit.dist.xml'

  publish:
    name: Publikacja obrazu prod
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Logowanie do Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadane tagów
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build + push (amd64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/php/Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
