services:
    db:
        image: mongo:8
        restart: unless-stopped
        environment:
            MONGO_INITDB_DATABASE: messenger_monitoring
        ports:
            - '27017:27017'
        volumes:
            - mongo_data:/data/db
        healthcheck:
            test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
            interval: 5s
            timeout: 3s
            retries: 10

    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        restart: unless-stopped
        volumes:
            - .:/app
            - docker/php/entrypoint.sh:/entrypoint.sh:ro
        entrypoint: ['/bin/bash', '/entrypoint.sh']
        depends_on:
            db:
                condition: service_healthy
        environment:
            MONGODB_URL: mongodb://db:27017
            MONGODB_DB: messenger_monitoring
            INGEST_API_KEY: change-me

    nginx:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - '8080:80'
        volumes:
            - .:/app:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php

volumes:
    mongo_data:
