name: messenger-monitoring-api

services:

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    volumes:
      - .:/var/www:rw
    environment:
      APP_ENV: ${APP_ENV:-dev}
      COMPOSER_ALLOW_SUPERUSER: 1
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: messenger_monitoring
    depends_on:
      - mongodb

  web:
    image: nginx:alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  mongodb:
    image: mongo:8
    volumes:
      - mongodb_data:/data/db:rw
    command: ['--quiet']
    # Opcjonalnie: wystaw Mongo lokalnie (np. dla Compass/symfony CLI)
    # ports:
    #   - "27017:27017"

volumes:
  mongodb_data:
